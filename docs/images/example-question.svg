<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Original question for screenshot card"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#607888" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ee"/><g font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="50" font-size="29" font-weight="700" fill="#183747">为什么看完一段话觉得熟悉，并不等于真正记住？</text><text x="32" y="122" font-size="27" font-weight="400" fill="#183747">A. 因为阅读时间太短</text><text x="32" y="195" font-size="27" font-weight="400" fill="#183747">B. 因为识别熟悉内容和脱离提示提取答案，是不同的任务</text><text x="32" y="268" font-size="27" font-weight="400" fill="#183747">C. 因为每次必须背下整页原文</text><text x="32" y="330" font-size="16" font-weight="400" fill="#607888">STUDY FLOW · 原创练习题 · MIT</text></g></svg>