<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-label="Obsidian Study Flow: content to memory"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#607888" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ee"/><g font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="64" y="60" font-size="18" font-weight="700" fill="#147d75">OBSIDIAN STUDY FLOW</text><text x="64" y="122" font-size="38" font-weight="700" fill="#183747">把值得记住的内容，变成能检验自己的问题</text><text x="64" y="164" font-size="21" font-weight="400" fill="#607888">自己的脚本连接已有插件；学习数据留在 Markdown 中。</text><rect x="64" y="220" width="350" height="135" rx="20" fill="#e7eee8" stroke="#d7e1df"/><text x="88" y="262" font-size="26" font-weight="700" fill="#183747">截图 / 复制文字</text><text x="88" y="302" font-size="19" font-weight="400" fill="#486273">题目与必要选项</text><text x="88" y="332" font-size="19" font-weight="400" fill="#486273">截图在剪贴板，文字可修改</text><rect x="64" y="410" width="350" height="135" rx="20" fill="#e7eee8" stroke="#d7e1df"/><text x="88" y="452" font-size="26" font-weight="700" fill="#183747">确认问题，写下答案</text><text x="88" y="492" font-size="19" font-weight="400" fill="#486273">选择复习卡组</text><text x="88" y="522" font-size="19" font-weight="400" fill="#486273">取消或空输入，不生成卡片</text><path d="M239 355 L239 402" fill="none" stroke="#607888" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="924" y="220" width="412" height="135" rx="20" fill="#fff0c6" stroke="#d7e1df"/><text x="948" y="262" font-size="26" font-weight="700" fill="#183747">PDF 文字选区</text><text x="948" y="302" font-size="19" font-weight="400" fill="#486273">来自当前 PDF 的真实选区</text><text x="948" y="332" font-size="19" font-weight="400" fill="#486273">保留页码和选区定位链接</text><rect x="924" y="410" width="412" height="165" rx="20" fill="#fff0c6" stroke="#d7e1df"/><text x="948" y="452" font-size="26" font-weight="700" fill="#183747">写小结，保存学习卡</text><text x="948" y="492" font-size="19" font-weight="400" fill="#486273">原文 + 自己的理解</text><text x="948" y="522" font-size="19" font-weight="400" fill="#486273">记录阅读过程，支持续读</text><text x="948" y="552" font-size="19" font-weight="400" fill="#486273">仅摘录时，不进入间隔复习</text><path d="M1130 355 L1130 402" fill="none" stroke="#607888" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="482" y="610" width="438" height="135" rx="20" fill="#e3edf8" stroke="#d7e1df"/><text x="506" y="652" font-size="26" font-weight="700" fill="#183747">Markdown 记忆卡片</text><text x="506" y="692" font-size="19" font-weight="400" fill="#486273">一问一答，答案放在背面</text><text x="506" y="722" font-size="19" font-weight="400" fill="#486273">PDF 卡片可回到原文选区</text><path d="M239 545 L239 677 L474 677" fill="none" stroke="#607888" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1130 575 L1130 677 L928 677" fill="none" stroke="#607888" stroke-width="2.5" marker-end="url(#arrow)"/><text x="932" y="613" font-size="19" font-weight="400" fill="#9c7831">勾选建卡 + 写问题</text><text x="948" y="642" font-size="19" font-weight="400" fill="#9c7831">再选择复习卡组</text><path d="M701 745 L701 792" fill="none" stroke="#607888" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="482" y="800" width="438" height="132" rx="20" fill="#dceee9" stroke="#d7e1df"/><text x="506" y="842" font-size="26" font-weight="700" fill="#183747">到期复习，先回忆再评分</text><text x="506" y="882" font-size="19" font-weight="400" fill="#486273">Spaced Repetition 安排下一次</text><text x="506" y="912" font-size="19" font-weight="400" fill="#486273">普通 Markdown 保存调度日期</text><text x="64" y="994" font-size="20" font-weight="700" fill="#147d75">执行入口：QuickAdd</text><text x="483" y="994" font-size="20" font-weight="700" fill="#147d75">PDF 选区与回链：PDF++</text><text x="925" y="994" font-size="20" font-weight="700" fill="#147d75">复习：Spaced Repetition</text></g></svg>